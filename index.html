<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>belarmino flow</title>
<meta name="theme-color" content="#17158F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="b.flow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: topo índigo → resumo do dia → filtros → quadro (celular: 1 coluna por vez com abas; computador: todas lado a lado) */
:root{
  --indigo:#17158F; --lime:#D7E928; --sky:#AAB8FF; --orange:#F29E4C; --violet:#9B7BFF;
  --bg:#F4F5FA; --surface:#FFFFFF; --col:#E9EBF7; --soft:#ECEEFA; --ink:#14134A; --muted:#5E6290; --line:#D9DCF0;
  --brand:#17158F; --brand-ink:#FFFFFF;
  --late:#C8293B; --late-bg:#FBE3E6; --ok:#2E7D4F; --ok-bg:#E0F2E7; --warn-bg:#FFF6D6;
  --display:"Montserrat",system-ui,sans-serif; --body:"Poppins",system-ui,sans-serif;
  --r:16px; --r-sm:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0B2E; --surface:#18174C; --col:#121140; --soft:#22216A; --ink:#EEF0FF; --muted:#A3A8D6; --line:#2C2B78;
  --brand:#AAB8FF; --brand-ink:#0C0B2E;
  --late:#FF8796; --late-bg:#3A1430; --ok:#7FE0A6; --ok-bg:#123A2A; --warn-bg:#2E2A10; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none}

/* ---------- Login ---------- */
.auth{min-height:100%;min-height:100dvh;display:grid;place-items:center;background:var(--indigo);color:#fff;padding:calc(24px + var(--safe-t)) var(--gr) calc(24px + var(--safe-b)) var(--gl);position:relative;overflow:hidden}
.auth::before,.auth::after{content:"";position:absolute;border-radius:40px;background:var(--sky);opacity:.18}
.auth::before{width:260px;height:260px;top:-80px;right:-90px;transform:rotate(18deg)}
.auth::after{width:180px;height:180px;bottom:-60px;left:-50px;background:var(--lime);opacity:.22;transform:rotate(-12deg)}
.auth-box{width:100%;max-width:380px;position:relative;z-index:1;display:grid;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;font:800 26px/1 var(--display);color:var(--indigo);position:relative;flex:none}
.logo::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);position:absolute;right:9px;bottom:11px}
.brand-name{font:800 22px/1 var(--display)}
.brand-name small{display:block;font:400 12px/1.4 var(--body);opacity:.75;margin-top:4px}
.auth h1{font-size:28px;line-height:1.15}
.auth h1 em{font-style:normal;color:var(--lime)}
.card-form .link{color:#17158F}
.card-form{background:#fff;color:#14134A;border-radius:20px;padding:20px;display:grid;gap:14px;color-scheme:light}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ECEEFA;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:#5E6290}
.seg button[aria-selected="true"]{background:#fff;color:#17158F;box-shadow:0 1px 3px rgba(23,21,143,.15)}
.field{display:grid;gap:5px}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.card-form .field>label{color:#5E6290}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;min-height:44px}
.card-form .input{border-color:#D9DCF0;background:#fff;color:#14134A}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:84px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-primary{background:var(--indigo);color:#fff}
.btn-lime{background:var(--lime);color:#17158F}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-danger{background:var(--late-bg);color:var(--late)}
.btn-danger-solid{background:var(--late);color:#fff}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px;justify-self:center}
.err{background:#FBE3E6;color:#A11F30;border-radius:9px;padding:9px 11px;font-size:13px}
.note{font-size:12px;color:#5E6290;margin:0}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .av{width:64px;height:64px;font-size:22px}
.demo-tag{background:var(--lime);color:#17158F;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;justify-self:start}

/* ---------- Avatares ---------- */
.av{width:28px;height:28px;border-radius:50%;background:var(--sky);color:#17158F;display:grid;place-items:center;font:600 11px/1 var(--body);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:44px;height:44px;font-size:15px}

/* ---------- Estrutura do app ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.top{background:var(--indigo);color:#fff;padding:calc(12px + var(--safe-t)) var(--gr) 0 var(--gl)}
.top-row{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.top .logo{width:38px;height:38px;font-size:22px;border-radius:11px}
.top .logo::after{width:6px;height:6px;right:8px;bottom:10px}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font:800 17px/1.15 var(--display)}
.top-title span{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:2px solid var(--lime);background:transparent;padding:0;border-radius:50%;display:grid}
.me-btn .av{width:36px;height:36px}
.nav{display:flex;gap:4px;max-width:1400px;margin:12px auto 0}
.nav button{border:0;background:transparent;color:#fff;opacity:.75;padding:10px 14px 12px;font-weight:600;position:relative}
.nav button[aria-selected="true"]{opacity:1}
.nav button[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--lime)}

.wrap{width:100%;max-width:1400px;margin:0 auto;padding:0 var(--gr) 0 var(--gl)}
.banner{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.banner p{margin:0;flex:1 1 220px;font-size:13px}
.banner b{display:block}

/* Resumo */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border:0;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:grid;gap:0;border:2px solid transparent}
.stat b{font:800 22px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}
.stat.late b{color:var(--late)}
.stat[aria-pressed="true"]{border-color:var(--brand)}

/* Busca e filtros */
.tools{display:flex;gap:8px;margin-top:12px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px;border-radius:999px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.icon-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.badge{background:var(--lime);color:#17158F;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;font-size:13px;min-height:36px;flex:none}
.chip.plain{padding:4px 14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .av{width:26px;height:26px;font-size:10px}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.pill{background:var(--soft);border:0;border-radius:999px;padding:4px 6px 4px 11px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink)}
.pill svg{width:14px;height:14px}

/* Abas de coluna (celular) */
.coltabs{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.coltabs::-webkit-scrollbar{display:none}
.coltab{border:0;background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.coltab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.coltab .n{font-variant-numeric:tabular-nums;opacity:.7;font-weight:500}

/* Quadro */
.board{display:flex;gap:14px;overflow-x:auto;padding:14px var(--gr) calc(110px + var(--safe-b)) var(--gl);align-items:flex-start;max-width:1400px;margin:0 auto;width:100%}
.col{background:var(--col);border-radius:var(--r);flex:1 0 270px;max-width:360px;display:flex;flex-direction:column;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 14px}
.col-head h2{font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.count{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.more{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover{background:var(--soft);color:var(--ink)}
.col-body{display:flex;flex-direction:column;gap:8px;padding:2px 8px 4px;min-height:40px}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 10px;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.add-in-col{border:0;background:transparent;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px 14px;border-radius:0 0 var(--r) var(--r);display:flex;gap:6px;align-items:center}
.add-in-col:hover{color:var(--ink)}
.add-col{flex:0 0 220px;border:2px dashed var(--line);background:transparent;border-radius:var(--r);min-height:56px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.add-col:hover{border-color:var(--brand);color:var(--ink)}

/* Card de tarefa */
.task{background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(20,19,74,.08);display:flex;align-items:flex-start;position:relative}
.task:hover{box-shadow:0 3px 12px rgba(20,19,74,.12)}
.task.dragging{opacity:.4}
.task-main{border:0;background:transparent;text-align:left;flex:1;min-width:0;padding:12px 4px 12px 14px;display:grid;gap:6px;cursor:pointer;border-radius:12px}
.task-title{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.task-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.task-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.task-meta .grow{flex:1}
.meta{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.meta svg{width:14px;height:14px}
.meta.late{color:var(--late);font-weight:600}
.meta.today{color:var(--brand);font-weight:600}
.meta.allok{color:var(--ok);font-weight:600}
.labels{display:flex;flex-wrap:wrap;gap:4px}
.lbl{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;line-height:1.5;background:var(--lb);color:var(--lf);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-pick{display:flex;flex-wrap:wrap;gap:8px}
.lbl-pick button{border:2px solid transparent;border-radius:9px;padding:6px 12px 6px 8px;font-weight:600;font-size:13px;background:var(--lb);color:var(--lf);display:inline-flex;align-items:center;gap:6px;opacity:.55;min-height:38px}
.lbl-pick button svg{width:14px;height:14px;opacity:0}
.lbl-pick button[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.lbl-pick button[aria-pressed="true"] svg{opacity:1}
.lbl-pick .new{background:transparent;color:var(--muted);border:1.5px dashed var(--line);opacity:1}
.lbl-pick .new svg{opacity:1}
.lbl-row{display:flex;align-items:center;gap:6px}
.lbl-row .lbl-name{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;text-align:left;font-weight:600;background:var(--lb);color:var(--lf);min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-use{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.field-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field-head .link{font-size:12px}
.preview-lbl{font-size:14px;padding:6px 14px;justify-self:start}
.urgent{background:var(--late-bg);color:var(--late);font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px}
.task .more{margin:6px 6px 0 0}
.sel-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin:13px 0 0 12px;color:transparent;background:var(--surface)}
.task.selected{box-shadow:0 0 0 2px var(--brand)}
.task.selected .sel-box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Barra de seleção */
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px var(--gr) calc(12px + var(--safe-b)) var(--gl);display:flex;gap:10px;align-items:center;z-index:15}
.selbar span{flex:1;font-weight:600}
.selbar .btn-ghost{color:var(--bg)}

.fab{position:fixed;right:calc(var(--gr) + 2px);bottom:calc(18px + var(--safe-b));background:var(--lime);color:#17158F;border:0;border-radius:18px;height:56px;padding:0 20px;font:800 15px/1 var(--display);box-shadow:0 6px 18px rgba(23,21,143,.3);display:flex;align-items:center;gap:8px;z-index:5}

/* Equipe */
.team{display:grid;gap:10px;padding:16px 0 calc(110px + var(--safe-b));max-width:720px}
.member{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.member .av{width:48px;height:48px;font-size:16px}
.member-info{flex:1 1 140px;min-width:0}
.member-name{font-weight:600}
.member-sub{font-size:12px;color:var(--muted);overflow-wrap:break-word}
.stats{display:flex;gap:16px;text-align:center}
.stats b{display:block;font:800 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.stats .late b{color:var(--late)}
.member.request{border:2px solid var(--lime)}
.req-actions{display:flex;gap:6px;margin-left:auto}
.nav button{position:relative}
.nav-badge{font-style:normal;background:var(--late);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;position:absolute;top:2px;right:calc(50% - 26px)}
@media (min-width:760px){.nav-badge{position:static;margin-left:2px}}
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Folhas (modais) */
.sheet-wrap{position:fixed;inset:0;background:rgba(12,11,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:640px){.sheet-wrap{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px var(--gr) calc(18px + var(--safe-b)) var(--gl);display:grid;gap:14px}
@media (min-width:640px){.sheet{border-radius:22px;padding:22px}}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h3{flex:1;font-size:18px;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.menu{display:grid;gap:4px}
.menu button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:500;min-height:48px}
.menu button:hover{background:var(--soft)}
.menu button.danger{color:var(--late)}
.menu button[aria-current="true"]{background:var(--soft);font-weight:600}
.menu .hint{font-size:12px;color:var(--muted);padding:2px 12px}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move-grid button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:600;text-align:left;min-height:48px}
.move-grid button[aria-current="true"]{border-color:var(--brand);background:var(--soft)}
.checklist{display:grid;gap:6px}
.ck{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:6px 6px 6px 10px}
.ck input[type=checkbox]{width:18px;height:18px;accent-color:var(--indigo);flex:none}
.ck span{flex:1;overflow-wrap:anywhere}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.ck button{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.ck-add{display:flex;gap:8px}
.ck-add .input{flex:1;min-width:0}
.progress{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--brand)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}
.confirm{background:var(--late-bg);color:var(--late);border-radius:12px;padding:12px;display:grid;gap:10px}
.confirm p{margin:0;color:var(--ink);font-size:13px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.meta-line{font-size:12px;color:var(--muted);margin:0}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:10px;border:3px solid transparent;display:grid;place-items:center;font-weight:700;font-size:12px}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.radio-list{display:grid;gap:8px}
.radio-list label{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink)}
.radio-list input{accent-color:var(--indigo);width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-weight:500;z-index:30;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;min-height:44px}
.toast button{border:0;background:var(--lime);color:#17158F;font-weight:600;border-radius:8px;padding:6px 12px}
.loading{display:grid;place-items:center;height:100%;background:var(--indigo)}
.loading .logo{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.9);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------- Navegação ---------- */
.nav button{display:inline-flex;align-items:center;gap:7px}
.nav button svg{width:18px;height:18px}

/* ---------- Início ---------- */
.home{padding-bottom:calc(120px + var(--safe-b))}
.hello{background:var(--indigo);color:#fff;border-radius:24px;padding:22px 20px 24px;margin-top:16px;position:relative;overflow:hidden;display:grid;gap:14px}
.hello::before{content:"";position:absolute;width:170px;height:170px;border-radius:40px;background:#fff;opacity:.07;right:-60px;top:-60px;transform:rotate(20deg)}
.hello::after{content:"";position:absolute;width:90px;height:90px;border-radius:26px;background:var(--lime);opacity:.16;right:28px;bottom:-46px;transform:rotate(-14deg)}
.hello>*{position:relative;z-index:1}
.hello-top{display:flex;align-items:center;gap:8px;font-size:13px;color:#DDE2FF}
.hello-top svg{width:20px;height:20px;color:var(--lime)}
.hello h1{font-size:clamp(28px,7.5vw,40px);line-height:1.08}
.phrase-box{display:grid;gap:6px;border-left:4px solid var(--lime);padding:2px 0 2px 14px}
.phrase-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);font-weight:600}
.phrase{font-size:clamp(17px,4.6vw,21px);font-weight:500;line-height:1.45;margin:0;max-width:38ch;color:#fff}
.sec-head{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.sec-head h2{font-size:18px;flex:1}
.grp{font:600 12px/1.4 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.grp.late{color:var(--late)}
.rlist{display:grid;gap:6px}
.rt{display:flex;align-items:center;background:var(--surface);border-radius:14px;min-width:0}
.done-btn{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;flex:none;border-radius:14px}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.done-btn:hover .circ{border-color:var(--ok);color:var(--ok)}
.rt-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 10px 10px 0;display:grid;gap:2px}
.rt-main b{font-weight:600;overflow-wrap:anywhere}
.rt-main span{font-size:12px;color:var(--muted)}
.rt-main em{font-style:normal;font-weight:600}
.rt-main em.late{color:var(--late)}
.rt-main em.today{color:var(--brand)}
.empty.big{display:grid;justify-items:center;gap:4px;padding:28px 16px;border:0;background:var(--surface);border-radius:var(--r);color:var(--muted)}
.empty.big svg{width:28px;height:28px;color:var(--ok)}
.empty.big b{color:var(--ink);font-size:15px}

/* ---------- Clientes ---------- */
.clients{padding-bottom:calc(120px + var(--safe-b))}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.ccard{border:0;background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.ccard:hover{box-shadow:0 3px 12px rgba(20,19,74,.1)}
.ccard>svg{color:var(--muted);width:18px;height:18px}
.cmark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:800 15px/1 var(--display);background:var(--lb);color:var(--lf);flex:none}
.cmark svg{width:20px;height:20px}
.ccard.all .cmark{background:var(--indigo);color:#fff}
.cinfo{flex:1;min-width:0;display:grid}
.cname{font-weight:600;overflow-wrap:anywhere}
.csub{font-size:12px;color:var(--muted)}
.csub .late,.chead-t .late{color:var(--late);font-weight:600}
.chead{display:flex;align-items:center;gap:12px;margin-top:16px}
.back{border:0;background:var(--surface);width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.chead-t{flex:1;min-width:0}
.chead-t h1{font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.chead-t span{font-size:12px;color:var(--muted)}
.sheet-head .cmark{width:38px;height:38px;font-size:13px}

/* Celular: navegação embaixo, como app */
@media (max-width:759px){
  .top{padding-bottom:12px}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:6px var(--gr) calc(6px + var(--safe-b)) var(--gl);z-index:12;justify-content:space-around;box-shadow:0 -4px 16px rgba(20,19,74,.06)}
  .nav button{flex:1;flex-direction:column;gap:3px;color:var(--muted);opacity:1;font-size:11px;padding:6px 4px}
  .nav button svg{width:24px;height:24px;padding:3px 14px;box-sizing:content-box;border-radius:999px}
  .nav button[aria-selected="true"]{color:var(--ink)}
  .nav button[aria-selected="true"] svg{background:var(--lime);color:#17158F}
  .nav button[aria-selected="true"]::after{display:none}
  .fab{bottom:calc(84px + var(--safe-b))}
  .board{padding-bottom:calc(170px + var(--safe-b))}
  .team,.home,.clients{padding-bottom:calc(170px + var(--safe-b))}
  .selbar{z-index:14}
}
/* Celular: uma coluna por vez */
@media (max-width:759px){
  .coltabs{display:flex}
  .board{display:block;padding-top:10px}
  .col{max-width:none;background:transparent}
  .col:not(.active),.add-col{display:none}
  .col-head{padding:4px 0 8px}
  .col-body{padding:0}
  .add-in-col{padding:12px 4px}
  .stat b{font-size:20px}
}
@media (max-width:420px){.sel-label{display:none}}

let toastTimer;
function toast(msg, action) {
  $('.toast')?.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.run(); };
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), action ? 6000 : 2400);
}
function resizeImage(file, size = 256) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => rej(new Error('Não consegui abrir essa imagem. Tente outra foto (JPG ou PNG).'));
      img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const CFG = window.FIREBASE_CONFIG || {};

function firebaseStore() {
  firebase.initializeApp(CFG);
  const auth = firebase.auth(), fs = firebase.firestore();
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  const T = fs.collection('tasks');
  return {
    onAuth: cb => auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => auth.signInWithEmailAndPassword(e, p),
    signUp: async (e, p) => { const c = await auth.createUserWithEmailAndPassword(e, p); return { uid: c.user.uid, email: c.user.email }; },
    reset: e => auth.sendPasswordResetEmail(e),
    signOut: () => auth.signOut(),
    onUsers: (cb, onErr) => fs.collection('users').onSnapshot(s => { const o = {}; s.forEach(d => o[d.id] = { id: d.id, ...d.data() }); cb(o); }, onErr),
    onTasks: (cb, onErr) => T.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr),
    onBoard: (cb, onErr) => fs.doc('meta/board').onSnapshot(d => cb(d.exists ? d.data().columns : null), onErr),
    saveBoard: columns => fs.doc('meta/board').set({ columns }),
    onClients: (cb, onErr) => fs.doc('meta/clients').onSnapshot(d => cb(d.exists ? d.data().clients : null), onErr),
    saveClients: clients => fs.doc('meta/clients').set({ clients }),
    onLabels: (cb, onErr) => fs.doc('meta/labels').onSnapshot(d => cb(d.exists ? d.data().labels : null), onErr),
    saveLabels: labels => fs.doc('meta/labels').set({ labels }),
    batchUpdate: async list => { for (let i = 0; i < list.length; i += 400) { const b = fs.batch(); list.slice(i, i + 400).forEach(x => b.update(T.doc(x.id), x.patch)); await b.commit(); } },
    getUser: async id => { const d = await fs.collection('users').doc(id).get(); return d.exists ? { id, ...d.data() } : null; },
    onMe: (id, cb, onErr) => fs.collection('users').doc(id).onSnapshot(d => cb(d.exists ? { id, ...d.data() } : null), onErr),
    saveUser: (id, data) => fs.collection('users').doc(id).set(data, { merge: true }),
    addTask: t => T.add(t),
    updateTask: (id, p) => T.doc(id).update(p),
    restoreTasks: async list => { const b = fs.batch(); list.forEach(({ id, ...t }) => b.set(T.doc(id), t)); await b.commit(); },
    deleteTasks: async ids => { for (let i = 0; i < ids.length; i += 400) { const b = fs.batch(); ids.slice(i, i + 400).forEach(id => b.delete(T.doc(id))); await b.commit(); } },
    moveTasks: async (ids, column) => { const b = fs.batch(); ids.forEach(id => b.update(T.doc(id), { column, updatedAt: Date.now() })); await b.commit(); },
  };
}

        { title: 'Ensaio de fotos de produto', client: 'Cliente exemplo C', type: 'Fotos', column: 'todo', assignee: 'k', due: dayStr(5), prio: 'baixa', checklist: [] },
      ].map((x, i) => ({ id: uid(), desc: '', example: true, createdAt: Date.now() - i * 1e5, createdBy: 'k', ...x })),
    };
  }
  const subs = { auth: [], users: [], tasks: [], board: [], labels: [], clients: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  const emit = () => { save(); subs.users.forEach(f => f({ ...db.users })); subs.tasks.forEach(f => f(db.tasks.map(t => ({ ...t })))); subs.board.forEach(f => f(db.columns)); subs.labels.forEach(f => f(db.labels)); subs.clients.forEach(f => f(db.clients)); };
  const sess = () => db.session ? { uid: db.session, email: db.users[db.session]?.email } : null;
  return {
    onAuth: cb => { subs.auth.push(cb); setTimeout(() => cb(sess())); return () => {}; },
    signIn: async e => {
      const u = Object.values(db.users).find(u => u.email.toLowerCase() === e.toLowerCase());
      if (!u) throw { code: 'auth/user-not-found' };
      db.session = u.id; save(); subs.auth.forEach(f => f(sess()));
    },
    signUp: async (e, p) => {
      if (!/\S+@\S+\.\S+/.test(e)) throw { code: 'auth/invalid-email' };
      if (Object.values(db.users).some(u => u.email.toLowerCase() === e.toLowerCase())) throw { code: 'auth/email-already-in-use' };
      if ((p || '').length < 6) throw { code: 'auth/weak-password' };
      const id = uid(); db.users[id] = { id, email: e, name: '', photo: '' }; db.session = id; save();
      return { uid: id, email: e };
    },
    reset: async () => {},
    signOut: async () => { db.session = null; save(); subs.auth.forEach(f => f(null)); },
    onUsers: cb => { subs.users.push(cb); setTimeout(() => cb({ ...db.users })); return () => {}; },
    onTasks: cb => { subs.tasks.push(cb); setTimeout(() => cb(db.tasks.map(t => ({ ...t })))); return () => {}; },
    onBoard: cb => { subs.board.push(cb); setTimeout(() => cb(db.columns)); return () => {}; },
    saveBoard: async columns => { db.columns = columns; emit(); },
    onClients: cb => { subs.clients.push(cb); setTimeout(() => cb(db.clients)); return () => {}; },
    saveClients: async clients => { db.clients = clients; emit(); },
    onLabels: cb => { subs.labels.push(cb); setTimeout(() => cb(db.labels)); return () => {}; },
    saveLabels: async labels => { db.labels = labels; emit(); },
    batchUpdate: async list => { list.forEach(x => { const t = db.tasks.find(y => y.id === x.id); if (t) Object.assign(t, x.patch); }); emit(); },
    getUser: async id => db.users[id]?.name ? { ...db.users[id] } : null,
    onMe: (id, cb) => { const f = u => cb(u[id] || null); subs.users.push(f); setTimeout(() => f(db.users)); return () => { subs.users = subs.users.filter(x => x !== f); }; },
    saveUser: async (id, data) => { db.users[id] = { ...(db.users[id] || { id }), ...data, id }; emit(); },
    afterSignUp: () => subs.auth.forEach(f => f(sess())),
    addTask: async t => { db.tasks.push({ id: uid(), ...t }); emit(); },
    updateTask: async (id, p) => { const t = db.tasks.find(x => x.id === id); if (t) Object.assign(t, p); emit(); },
    restoreTasks: async list => { const ids = new Set(list.map(t => t.id)); db.tasks = db.tasks.filter(t => !ids.has(t.id)).concat(list.map(t => ({ ...t }))); emit(); },
    deleteTasks: async ids => { const s = new Set(ids); db.tasks = db.tasks.filter(x => !s.has(x.id)); emit(); },
    moveTasks: async (ids, column) => { db.tasks.forEach(t => { if (ids.includes(t.id)) t.column = column; }); emit(); },
  };
}

function period() { const h = new Date().getHours(); return h >= 5 && h < 12 ? 'manha' : h >= 12 && h < 18 ? 'tarde' : 'noite'; }
function phraseNow() {
  const p = period(), list = PHRASES[p], d = new Date();

function visibleTasks() {

    <div class="sec-head"><h2>Clientes</h2><button class="btn btn-soft" id="newClient">${ICON.plus} Novo cliente</button></div>
    <div class="cgrid">
      <button class="ccard all" data-client-open="*"><span class="cmark">${ICON.cols}</span><span class="cinfo"><span class="cname">Quadro geral</span><span class="csub">Todas as tarefas · ${clientStats(S.tasks)}</span></span>${ICON.chev}</button>

  </div>`;
}
function clientPageHTML() {
  const k = S.clientOpen, c = k === '*' ? null : k === '__none' ? null : clientByName(k);

function boardHTML() {

  const nFilters = (S.who !== 'all') + (all && !!S.client) + !!S.label;
  const users = teamList();
  const activeCol = colById(S.col);
  const filterPills = [
    S.who !== 'all' && { k: 'who', t: S.who === 'me' ? 'Só minhas' : 'De ' + (S.users[S.who]?.name || '…') },
    all && S.client && { k: 'client', t: 'Cliente: ' + S.client },
    S.label && { k: 'label', t: 'Etiqueta: ' + (labelById(S.label)?.name || '') },
    S.q && { k: 'q', t: `Busca: "${S.q}"` },
  ].filter(Boolean);
  return `
  <div class="wrap">
    <div class="tools">
      <label class="search">${ICON.search}<input class="input" id="q" type="search" placeholder="Buscar neste quadro" value="${esc(S.q)}" aria-label="Buscar"></label>
      <button class="icon-btn" id="tFilters" aria-pressed="${S.showFilters}">${ICON.filter}<span class="sel-label">Filtros</span>${nFilters ? ` <span class="badge">${nFilters}</span>` : ''}</button>
      <button class="icon-btn" id="tSelect" aria-pressed="${S.selecting}" title="Selecionar várias">${ICON.select}<span class="sel-label">Selecionar</span></button>
    </div>
    ${S.showFilters ? `
    <div class="chips" aria-label="Responsável">
      <button class="chip plain" aria-pressed="${S.who === 'all'}" data-who="all">Todos</button>
      <button class="chip plain" aria-pressed="${S.who === 'me'}" data-who="me">Só minhas</button>
      ${users.filter(u => u.id !== S.me.uid).map(u => `<button class="chip" aria-pressed="${S.who === u.id}" data-who="${esc(u.id)}">${avatar(u)}${esc(u.name)}</button>`).join('')}
    </div>
    ${all ? `<div class="chips" aria-label="Cliente">
      <button class="chip plain" aria-pressed="${!S.client}" data-client="">Todos os clientes</button>
      ${clients().map(c => `<button class="chip plain" aria-pressed="${S.client === c}" data-client="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>` : ''}
    <div class="chips" aria-label="Etiqueta">
      <button class="chip plain" aria-pressed="${!S.label}" data-label="">Todas as etiquetas</button>
      ${S.labels.map(l => `<button class="chip plain" aria-pressed="${S.label === l.id}" data-label="${esc(l.id)}"><span class="dot" style="background:${(LABEL_COLORS[l.color] || LABEL_COLORS.gray).bg}"></span>${esc(l.name)}</button>`).join('')}
    </div>` : ''}
    ${filterPills.length ? `<div class="active-filters">Mostrando: ${filterPills.map(p => `<button class="pill" data-clear="${p.k}" aria-label="Remover filtro ${esc(p.t)}">${esc(p.t)}${ICON.x}</button>`).join('')}</div>` : ''}
    <div class="coltabs" role="tablist" aria-label="Etapas">
      ${S.columns.map(c => `<button class="coltab" role="tab" aria-selected="${c.id === activeCol.id}" data-coltab="${esc(c.id)}"><span class="dot" style="background:${COLORS[c.color] || COLORS.sky}"></span>${esc(c.name)}<span class="n">${vt.filter(t => colById(t.column).id === c.id).length}</span></button>`).join('')}
    </div>
  </div>
  <section class="board">
    ${S.columns.map(c => {
      const list = vt.filter(t => colById(t.column).id === c.id).sort(sortTasks);
      return `<div class="col ${c.id === activeCol.id ? 'active' : ''}" data-col="${esc(c.id)}">
        <div class="col-head"><span class="dot" style="background:${COLORS[c.color] || COLORS.sky}"></span><h2>${esc(c.name)}</h2><span class="count">${list.length}</span><button class="more" data-colmenu="${esc(c.id)}" aria-label="Opções da coluna ${esc(c.name)}">${ICON.dots}</button></div>
        <div class="col-body">${list.length ? list.map(taskHTML).join('') : `<div class="empty">${filterPills.length ? 'Nenhuma tarefa com esses filtros' : 'Nenhuma tarefa aqui'}</div>`}</div>
        <button class="add-in-col" data-add="${esc(c.id)}">${ICON.plus} Adicionar tarefa</button>
      </div>`;
    }).join('')}
    <button class="add-col" id="addCol">${ICON.plus} Nova coluna</button>
  </section>`;
}

function taskHTML(t) {
  const today = dayStr(), u = S.users[t.assignee];
  const ck = t.checklist || [], doneCk = ck.filter(x => x.done).length;
  let dueCls = '', dueTxt = '';
  if (t.due) {
    const open = isOpen(t);
    dueCls = open && t.due < today ? 'late' : open && t.due === today ? 'today' : '';
    dueTxt = dueCls === 'late' ? 'Atrasada · ' + fmtDate(t.due) : t.due === today ? 'Hoje' : t.due === dayStr(1) ? 'Amanhã' : fmtDate(t.due);
  }
  const sub = t.client && S.clientOpen === '*' ? esc(t.client) : '';
  const lbls = taskLabelIds(t).map(labelById);
  const sel = S.selected.has(t.id);
  return `<div class="task ${sel ? 'selected' : ''}" draggable="${!S.selecting}" data-task="${esc(t.id)}">
    ${S.selecting ? `<span class="sel-box" aria-hidden="true">${ICON.check}</span>` : ''}
    <button class="task-main" data-open="${esc(t.id)}" ${S.selecting ? `aria-pressed="${sel}"` : ''}>
      ${lbls.length ? `<span class="labels">${lbls.map(l => `<span class="lbl" style="${lblStyle(l.color)}">${esc(l.name)}</span>`).join('')}</span>` : ''}
      <span class="task-title">${esc(t.title)}</span>
      ${sub ? `<span class="task-sub">${sub}</span>` : ''}
      <span class="task-meta">
        ${t.prio === 'alta' ? '<span class="urgent">Urgente</span>' : ''}
        ${dueTxt ? `<span class="meta ${dueCls}">${ICON.cal}${dueTxt}</span>` : ''}
        ${ck.length ? `<span class="meta ${doneCk === ck.length ? 'allok' : ''}">${ICON.check}${doneCk}/${ck.length}</span>` : ''}
        <span class="grow"></span>
        ${avatar(u)}
      </span>
    </button>
    ${S.selecting ? '' : `<button class="more" data-taskmenu="${esc(t.id)}" aria-label="Opções da tarefa">${ICON.dots}</button>`}
  </div>`;
}

function selbarHTML() {
  const n = S.selected.size;
  return `<div class="selbar"><span>${n ? plural(n, 'selecionada', 'selecionadas') : 'Toque nas tarefas'}</span>
    <button class="btn btn-ghost" id="selCancel">Cancelar</button>
    <button class="btn btn-lime" id="selMove" ${n ? '' : 'disabled'}>${ICON.move} Mover</button>
    <button class="btn btn-danger-solid" id="selDel" ${n ? '' : 'disabled'}>${ICON.trash} Excluir</button></div>`;
}

function teamHTML() {
  const today = dayStr(), users = teamList();
  const rows = users.map(u => {
    const t = S.tasks.filter(x => x.assignee === u.id), open = t.filter(isOpen);
    const late = open.filter(x => x.due && x.due < today).length;
    const rev = t.filter(x => colById(x.column).id === 'review').length;
    const canRemove = isAdmin() && u.id !== S.me.uid && !isAdminEmail(u.email);
    return `<div class="member">${avatar(u)}<div class="member-info"><div class="member-name">${esc(u.name)}${u.id === S.me.uid ? ' (você)' : ''}</div><div class="member-sub">${esc(u.role || u.email || '')}</div></div>
      <div class="stats"><div><b>${open.length}</b><span>abertas</span></div><div><b>${rev}</b><span>aprovação</span></div><div class="${late ? 'late' : ''}"><b>${late}</b><span>atrasadas</span></div></div>
      ${canRemove ? `<button class="more" data-member="${esc(u.id)}" aria-label="Opções de ${esc(u.name)}">${ICON.dots}</button>` : ''}</div>`;
  }).join('');
  const none = S.tasks.filter(t => !t.assignee && isOpen(t)).length;
  const pend = isAdmin() ? pendingList() : [];
  const refused = isAdmin() ? Object.values(S.users).filter(u => u.name && !isApproved(u) && u.recusado) : [];
  return `<div class="wrap"><section class="team">
    ${pend.length ? `<div class="sec-head" style="margin-top:6px"><h2>Pedidos de acesso</h2><span class="badge">${pend.length}</span></div>
    ${pend.map(u => `<div class="member request">${avatar(u)}<div class="member-info"><div class="member-name">${esc(u.name)}</div><div class="member-sub">${esc(u.email || '')}${u.role ? ' · ' + esc(u.role) : ''}</div></div>
      <div class="req-actions"><button class="btn btn-ghost" data-refuse="${esc(u.id)}">Recusar</button><button class="btn btn-primary" data-approve="${esc(u.id)}">${ICON.check} Aprovar</button></div></div>`).join('')}` : ''}
    <div class="sec-head" style="margin-top:6px"><h2>Equipe</h2><span class="count">${users.length}</span></div>
    ${rows}
    ${none ? `<p class="meta-line">${plural(none, 'tarefa aberta está', 'tarefas abertas estão')} sem responsável.</p>` : ''}
    <p class="meta-line">Para entrar na equipe, a pessoa abre o app, toca em "Criar conta" e escolhe nome e foto.${isAdmin() ? ' O pedido aparece aqui pra você aprovar.' : ' Depois o Kaique aprova o acesso.'}</p>
    ${refused.length ? `<h3 class="grp">Sem acesso</h3>${refused.map(u => `<div class="member">${avatar(u)}<div class="member-info"><div class="member-name">${esc(u.name)}</div><div class="member-sub">${esc(u.email || '')}</div></div><button class="btn btn-soft" data-approve="${esc(u.id)}">Liberar acesso</button></div>`).join('')}` : ''}
  </section></div>`;
}

function bindApp() {
  $$('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; S.q = ''; exitSelect(false); savePrefs(); render(); window.scrollTo(0, 0); });
  $('#meBtn').onclick = openMenu;
  $('#fab')?.addEventListener('click', () => openTask(null, S.view === 'client' ? S.col : S.columns[0].id));
  $('#clearEx')?.addEventListener('click', clearExamples);
  $$('[data-quicklist]').forEach(b => b.onclick = () => openListSheet(b.dataset.quicklist));
  $$('[data-done]').forEach(b => b.onclick = () => completeTask(b.dataset.done));
  $('#newClient')?.addEventListener('click', () => openClient(null));
  $$('[data-approve]').forEach(b => b.onclick = async () => { try { await store.saveUser(b.dataset.approve, { aprovado: true, recusado: false }); toast(`${S.users[b.dataset.approve]?.name || 'Pessoa'} agora faz parte da equipe`); } catch (e) { toast(errMsg(e)); } });
  $$('[data-refuse]').forEach(b => b.onclick = async () => { try { await store.saveUser(b.dataset.refuse, { aprovado: false, recusado: true }); toast('Pedido recusado'); } catch (e) { toast(errMsg(e)); } });
  $$('[data-member]').forEach(b => b.onclick = () => openMemberMenu(S.users[b.dataset.member]));
  $$('[data-client-open]').forEach(b => b.onclick = () => { S.clientOpen = b.dataset.clientOpen; S.view = 'client'; S.q = ''; S.client = ''; savePrefs(); render(); window.scrollTo(0, 0); });
  $('#back')?.addEventListener('click', () => { S.view = 'clients'; exitSelect(false); savePrefs(); render(); });
  $('#clientMenu')?.addEventListener('click', () => openClientMenu(clientByName(S.clientOpen)));
  let qT; $('#q')?.addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 200); });
  $('#tFilters')?.addEventListener('click', () => { S.showFilters = !S.showFilters; render(); });
  $('#tSelect')?.addEventListener('click', () => { S.selecting ? exitSelect() : (S.selecting = true, render()); });
  $$('[data-who]').forEach(b => b.onclick = () => { S.who = b.dataset.who; savePrefs(); render(); });
  $$('[data-client]').forEach(b => b.onclick = () => { S.client = b.dataset.client; render(); });
  $$('[data-label]').forEach(b => b.onclick = () => { S.label = b.dataset.label; render(); });
  $$('[data-clear]').forEach(b => b.onclick = () => { const k = b.dataset.clear; if (k === 'who') S.who = 'all'; else S[k] = ''; savePrefs(); render(); });
  $$('[data-coltab]').forEach(b => b.onclick = () => { S.col = b.dataset.coltab; savePrefs(); render(); });
  $$('[data-add]').forEach(b => b.onclick = () => openTask(null, b.dataset.add));
  $('#addCol')?.addEventListener('click', () => openColumn(null));
  $$('[data-colmenu]').forEach(b => b.onclick = () => openColumnMenu(b.dataset.colmenu));
  $$('[data-taskmenu]').forEach(b => b.onclick = () => openTaskMenu(b.dataset.taskmenu));
  $$('[data-open]').forEach(b => b.onclick = () => {
    const id = b.dataset.open;
    if (S.selecting) { S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); render(); }
    else openTask(S.tasks.find(t => t.id === id));
  });
  $$('.task[draggable="true"]').forEach(el => {
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.task); el.classList.add('dragging'); };
    el.ondragend = () => el.classList.remove('dragging');
  });
  $$('[data-col]').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('over'); const t = S.tasks.find(x => x.id === e.dataTransfer.getData('text/plain')); if (t && colById(t.column).id !== col.dataset.col) moveTasks([t.id], col.dataset.col); };
  });
  $('#selCancel')?.addEventListener('click', () => exitSelect());
  $('#selDel')?.addEventListener('click', () => deleteTasks([...S.selected], true));
  $('#selMove')?.addEventListener('click', () => openMoveSheet([...S.selected]));
}
async function completeTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const from = t.column;
  try {
    await store.moveTasks([id], doneColId());
    toast('Tarefa concluída', { label: 'Desfazer', run: () => store.moveTasks([id], from) });
  } catch (e) { toast(errMsg(e)); }
}

/* ---------- Editar / excluir cliente ---------- */
function openClient(c, after) {
  const isNew = !c, keys = Object.keys(LABEL_COLORS);
  const st = { color: c?.color || keys[(S.clientsMeta.length + 2) % keys.length] };
  openSheet(`
    <div class="sheet-head"><h3>${isNew ? 'Novo cliente' : 'Editar cliente'}</h3><button class="x" id="ceX" aria-label="Fechar">${ICON.x}</button></div>
    <div id="ceErr"></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="cmark" id="cePrev" style="${lblStyle(st.color)}">${esc(c ? clientInitials(c.name) : '?')}</span><span class="meta-line">Assim o cliente aparece na lista.</span></div>
    <div class="field"><label for="ceName">Nome do cliente</label><input class="input" id="ceName" maxlength="50" value="${esc(c?.name || '')}" placeholder="Ex.: Divino Brownie"></div>
    <div class="field"><label>Cor</label><div class="colors">${keys.map(k => `<button type="button" data-cc="${k}" aria-pressed="${st.color === k}" style="background:${LABEL_COLORS[k].bg};color:${LABEL_COLORS[k].fg}" aria-label="${LABEL_COLORS[k].name}" title="${LABEL_COLORS[k].name}">Aa</button>`).join('')}</div></div>
    <div class="actions"><div class="right"><button class="btn btn-ghost" id="ceCancel">Cancelar</button><button class="btn btn-primary" id="ceSave">${isNew ? 'Criar cliente' : 'Salvar'}</button></div></div>`);
  const prev = () => { const p = $('#cePrev'); p.textContent = clientInitials($('#ceName').value || '?'); p.setAttribute('style', lblStyle(st.color)); };
  $$('[data-cc]').forEach(b => b.onclick = () => { st.color = b.dataset.cc; $$('[data-cc]').forEach(x => x.setAttribute('aria-pressed', x === b)); prev(); });
  $('#ceName').oninput = prev;
  setTimeout(() => $('#ceName').focus(), 50);
  const leave = () => after ? after(null) : closeSheet();
  $('#ceX').onclick = $('#ceCancel').onclick = leave;
  const save = async () => {
    const name = $('#ceName').value.trim();
    if (!name) { $('#ceErr').innerHTML = '<div class="err">Escreva o nome do cliente.</div>'; return; }
    const dup = clientByName(name);
    if (dup && (!c || dup.name.toLowerCase() !== c.name.toLowerCase())) { $('#ceErr').innerHTML = '<div class="err">Já existe um cliente com esse nome.</div>'; return; }
    try {
      const meta = S.clientsMeta.filter(x => !c || x.id !== c.id);
      const nc = { id: c && !c.implicit ? c.id : 'c' + uid(), name, color: st.color };
      meta.push(nc);
      if (c && c.name !== name) {
        const hit = S.tasks.filter(t => sameClient(t, c.name));
        if (hit.length) await store.batchUpdate(hit.map(t => ({ id: t.id, patch: { client: name } })));
        if (S.clientOpen === c.name) S.clientOpen = name;
      }
      await store.saveClients(meta); S.clientsMeta = meta;
      toast(isNew ? 'Cliente criado' : 'Cliente salvo');
      after ? after(nc) : (closeSheet(), render());
    } catch (e) { toast(errMsg(e)); }
  };
  $('#ceSave').onclick = save;
  $('#ceName').onkeydown = e => { if (e.key === 'Enter') save(); };
}
function openClientMenu(c) {
  if (!c) return;
  const n = S.tasks.filter(t => sameClient(t, c.name)).length;
  openSheet(`
    <div class="sheet-head"><span class="cmark" style="${lblStyle(c.color)}">${esc(clientInitials(c.name))}</span><h3>${esc(c.name)}</h3><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <div class="menu">
      <button id="cmEdit">${ICON.edit} Renomear ou mudar cor</button>
      <div class="menu-sep"></div>
      <button class="danger" id="cmDel">${ICON.trash} Excluir cliente</button>
    </div>
    <div id="cmZone"></div>`);
  $('#cmEdit').onclick = () => openClient(c);
  $('#cmDel').onclick = () => {
    $('#cmZone').innerHTML = `<div class="confirm"><b>Excluir o cliente "${esc(c.name)}"?</b>
      ${n ? `<p>Ele tem ${plural(n, 'tarefa', 'tarefas')}. O que fazer com ${n === 1 ? 'ela' : 'elas'}?</p>
      <div class="radio-list"><label><input type="radio" name="cdest" value="keep" checked>Manter as tarefas, sem cliente</label><label><input type="radio" name="cdest" value="del">Excluir as tarefas também</label></div>` : ''}
      <div class="row"><button class="btn btn-danger-solid" id="cmYes">Excluir cliente</button><button class="btn btn-ghost" data-close>Cancelar</button></div></div>`;
    $('#cmZone').scrollIntoView({ block: 'nearest' });
    $('#cmYes').onclick = async () => {
      const hit = S.tasks.filter(t => sameClient(t, c.name)).map(t => t.id);
      try {
        if (hit.length) { if ($('input[name=cdest]:checked')?.value === 'del') await store.deleteTasks(hit); else await store.batchUpdate(hit.map(id => ({ id, patch: { client: '' } }))); }
        const meta = S.clientsMeta.filter(x => x.id !== c.id && x.name.toLowerCase() !== c.name.toLowerCase());
        await store.saveClients(meta); S.clientsMeta = meta;
        closeSheet(); S.view = 'clients'; savePrefs(); render(); toast('Cliente excluído');
      } catch (e) { toast(errMsg(e)); }
    };
  };
}
function exitSelect(rerender = true) { S.selecting = false; S.selected.clear(); if (rerender) render(); }

/* ---------- Ações ---------- */
async function moveTasks(ids, column) {
  try {
    await store.moveTasks(ids, column);
    toast(`${ids.length > 1 ? plural(ids.length, 'tarefa movida', 'tarefas movidas') : 'Movida'} para ${colById(column).name}`);
  } catch (e) { toast(errMsg(e)); }
}
async function deleteTasks(ids, fromSelection) {
  const backup = S.tasks.filter(t => ids.includes(t.id)).map(t => ({ ...t }));
  if (!backup.length) return;
  try {
    await store.deleteTasks(ids);
    if (fromSelection) exitSelect();
    closeSheet();
    toast(backup.length > 1 ? plural(backup.length, 'tarefa excluída', 'tarefas excluídas') : 'Tarefa excluída', { label: 'Desfazer', run: () => store.restoreTasks(backup).then(() => toast('Restaurada')).catch(e => toast(errMsg(e))) });
  } catch (e) { toast(errMsg(e)); }
}
function clearExamples() {
  const ids = S.tasks.filter(t => t.example).map(t => t.id);
  openSheet(`
    <div class="sheet-head"><h3>Apagar tarefas de exemplo?</h3><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <p class="meta-line">${plural(ids.length, 'tarefa de exemplo vai', 'tarefas de exemplo vão')} sair do quadro. As tarefas que vocês criaram continuam.</p>

/* ---------- Folhas ---------- */
function openSheet(html) {
  closeSheet();
  const w = document.createElement('div'); w.className = 'sheet-wrap'; w.id = 'sheet';
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(w);
  document.addEventListener('keydown', escClose);
  return w;
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheet')?.remove(); document.removeEventListener('keydown', escClose); }

function openTaskMenu(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const cur = colById(t.column).id;
  openSheet(`
    <div class="sheet-head"><h3>${esc(t.title)}</h3><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <div class="field"><label>Mover para</label>
      <div class="move-grid">${S.columns.map(c => `<button data-moveto="${esc(c.id)}" aria-current="${c.id === cur}"><span class="dot" style="background:${COLORS[c.color] || COLORS.sky}"></span>${esc(c.name)}</button>`).join('')}</div>
    </div>
    <div class="menu">
      <button id="mEdit">${ICON.edit} Abrir e editar</button>
      <button class="danger" id="mDel">${ICON.trash} Excluir tarefa</button>
    </div>`);
  $$('[data-moveto]').forEach(b => b.onclick = () => { closeSheet(); if (b.dataset.moveto !== cur) moveTasks([id], b.dataset.moveto); });
  $('#mEdit').onclick = () => openTask(t);
  $('#mDel').onclick = () => deleteTasks([id]);
}

function openMoveSheet(ids) {

    $('#cZone').innerHTML = `<div class="confirm"><b>Excluir a coluna "${esc(c.name)}"?</b>
      ${n ? `<p>O que fazer com ${n === 1 ? 'a tarefa' : 'as ' + n + ' tarefas'} dela?</p>

function openTask(t, col, draft) {
  const isNew = !t;

  const d = draft || (t ? JSON.parse(JSON.stringify(t)) : { title: '', desc: '', client: presetClient, column: colById(col).id, assignee: S.me.uid, due: '', prio: 'media', checklist: [], labels: S.label ? [S.label] : [] });

  const users = teamList(), creator = t && S.users[t.createdBy];

      <div class="field"><label for="tPrio">Prioridade</label><select class="input" id="tPrio">${Object.entries(PRIOS).map(([k, v]) => `<option value="${k}" ${d.prio === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="tDesc">Detalhes</label><textarea class="input" id="tDesc" maxlength="3000" placeholder="Briefing, links, referências…">${esc(d.desc)}</textarea></div>
    <div class="field"><label for="ckNew">Checklist</label><div id="ckWrap"></div>
      <div class="ck-add"><input class="input" id="ckNew" maxlength="120" placeholder="Adicionar um passo"><button class="btn btn-lime" id="ckAdd" type="button" aria-label="Adicionar passo">${ICON.plus}</button></div>
    </div>
    ${t ? `<p class="meta-line">Criada${creator ? ' por ' + esc(creator.name) : ''}${t.createdAt ? ' em ' + new Date(t.createdAt).toLocaleDateString('pt-BR') : ''}${t.updatedBy && S.users[t.updatedBy] ? ' · última alteração por ' + esc(S.users[t.updatedBy].name) : ''}</p>` : ''}
    <div class="actions">
      ${t ? `<button class="btn btn-danger" id="tDel" type="button">${ICON.trash} Excluir</button>` : ''}

    </div>`);
  const renderCk = () => {
    const done = d.checklist.filter(x => x.done).length;
    $('#ckWrap').innerHTML = (d.checklist.length ? `<div class="progress"><i style="width:${Math.round(done / d.checklist.length * 100)}%"></i></div>` : '') +
      `<div class="checklist">${d.checklist.map(x => `<div class="ck ${x.done ? 'done' : ''}"><input type="checkbox" id="ck-${x.id}" data-ck="${x.id}" ${x.done ? 'checked' : ''} aria-label="${esc(x.text)}"><span>${esc(x.text)}</span><button type="button" data-ckdel="${x.id}" aria-label="Remover passo">${ICON.x}</button></div>`).join('')}</div>`;
    w.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { d.checklist.find(x => x.id === c.dataset.ck).done = c.checked; renderCk(); });
    w.querySelectorAll('[data-ckdel]').forEach(b => b.onclick = () => { d.checklist = d.checklist.filter(x => x.id !== b.dataset.ckdel); renderCk(); });

  };
  renderLbl();
  $('#tClient').onchange = e => { if (e.target.value !== '__new') return; grab(); d.client = ''; openClient(null, nc => { if (nc) d.client = nc.name; openTask(t, col, d); }); };
  $('#tLblEdit').onclick = () => { grab(); openLabelsManager(() => openTask(t, col, d)); };
  const addCk = () => { const v = $('#ckNew').value.trim(); if (!v) return; d.checklist.push({ id: uid(), text: v, done: false }); $('#ckNew').value = ''; renderCk(); $('#ckNew').focus(); };
  $('#ckAdd').onclick = addCk;
  $('#ckNew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addCk(); } };
  if (isNew) setTimeout(() => $('#tTitle').focus(), 50);
  $('#tDel')?.addEventListener('click', () => deleteTasks([t.id]));
  $('#tSave').onclick = async () => {
    const title = $('#tTitle').value.trim();
    if (!title) { $('#tErr').innerHTML = '<div class="err">Escreva o que precisa ser feito.</div>'; $('#tTitle').focus(); return; }
    const data = {
      title, desc: $('#tDesc').value.trim(), client: $('#tClient').value.trim(), labels: d.labels.filter(id => labelById(id)), type: '',
      assignee: $('#tWho').value, due: $('#tDue').value, column: $('#tCol').value, prio: $('#tPrio').value,
      checklist: d.checklist, updatedAt: Date.now(), updatedBy: S.me.uid,
    };
    $('#tSave').disabled = true;
    try {
      if (isNew) await store.addTask({ ...data, createdAt: Date.now(), createdBy: S.me.uid });
      else await store.updateTask(t.id, data);
      closeSheet(); toast(isNew ? 'Tarefa criada' : 'Tarefa salva');
    } catch (e) { $('#tSave').disabled = false; $('#tErr').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; }
  };
}

/* ---------- Etiquetas ---------- */
const labelUse = id => S.tasks.filter(t => taskLabelIds(t).includes(id)).length;
function openLabelsManager(back) {
  openSheet(`
    <div class="sheet-head"><h3>Etiquetas</h3><button class="x" id="lmClose" aria-label="Fechar">${ICON.x}</button></div>
    <p class="meta-line">Toque numa etiqueta para mudar o nome ou a cor. Elas valem para toda a equipe.</p>
    <div class="menu">
      ${S.labels.length ? S.labels.map(l => `<div class="lbl-row">
        <button class="lbl-name" style="${lblStyle(l.color)}" data-ledit="${esc(l.id)}">${esc(l.name)}</button>
        <span class="lbl-use">${plural(labelUse(l.id), 'tarefa', 'tarefas')}</span>
        <button class="more" data-ldel="${esc(l.id)}" aria-label="Excluir etiqueta ${esc(l.name)}">${ICON.trash}</button>
      </div>`).join('') : '<p class="meta-line">Nenhuma etiqueta ainda.</p>'}
      <button id="lmAdd">${ICON.plus} Nova etiqueta</button>
    </div>
    <div id="lmZone"></div>
    ${back ? '<div class="actions"><div class="right"><button class="btn btn-primary" id="lmBack">Voltar para a tarefa</button></div></div>' : ''}`);
  const again = () => openLabelsManager(back);
  const done = () => back ? back() : closeSheet();
  $('#lmClose').onclick = done;
  $('#lmBack')?.addEventListener('click', done);
  $('#lmAdd').onclick = () => openLabel(null, again);
  $$('[data-ledit]').forEach(b => b.onclick = () => openLabel(labelById(b.dataset.ledit), again));
  $$('[data-ldel]').forEach(b => b.onclick = () => {
    const l = labelById(b.dataset.ldel), n = labelUse(l.id);
    $('#lmZone').innerHTML = `<div class="confirm"><b>Excluir a etiqueta "${esc(l.name)}"?</b><p>${n ? `Ela sai de ${plural(n, 'tarefa', 'tarefas')}. As tarefas continuam no quadro.` : 'Nenhuma tarefa usa essa etiqueta.'}</p>
      <div class="row"><button class="btn btn-danger-solid" id="ldYes">Excluir etiqueta</button><button class="btn btn-ghost" id="ldNo">Cancelar</button></div></div>`;
    $('#lmZone').scrollIntoView({ block: 'nearest' });
    $('#ldNo').onclick = () => $('#lmZone').innerHTML = '';
    $('#ldYes').onclick = async () => {
      try {
        const hit = S.tasks.filter(t => taskLabelIds(t).includes(l.id) || Array.isArray(t.labels) && t.labels.includes(l.id));
        if (hit.length) await store.batchUpdate(hit.map(t => ({ id: t.id, patch: { labels: taskLabelIds(t).filter(x => x !== l.id), type: '' } })));
        await store.saveLabels(S.labels.filter(x => x.id !== l.id));
        S.labels = S.labels.filter(x => x.id !== l.id);
        if (S.label === l.id) S.label = '';
        toast('Etiqueta excluída'); again();
      } catch (e) { toast(errMsg(e)); }
    };
  });
}

  const save = async () => {
    const name = $('#leName').value.trim();
    if (!name) { $('#leErr').innerHTML = '<div class="err">Dê um nome para a etiqueta.</div>'; return; }
    if (S.labels.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== l?.id)) { $('#leErr').innerHTML = '<div class="err">Já existe uma etiqueta com esse nome.</div>'; return; }
    const nl = isNew ? { id: 'l' + uid(), name, color: st.color } : { ...l, name, color: st.color };
    const labels = isNew ? [...S.labels, nl] : S.labels.map(x => x.id === l.id ? nl : x);
    try { await store.saveLabels(labels); S.labels = labels; toast(isNew ? 'Etiqueta criada' : 'Etiqueta salva'); after ? after(nl) : closeSheet(); }
    catch (e) { toast(errMsg(e)); }
  };
  $('#leSave').onclick = save;
  $('#leName').onkeydown = e => { if (e.key === 'Enter') save(); };
}

function openProfile() {
  const st = { photo: S.profile.photo || '' };
  openSheet(`
    <div class="sheet-head"><h3>Meu perfil</h3><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <p class="meta-line">${esc(S.me.email || '')}</p>
    <div id="pErr"></div>
    ${profileFields(S.profile)}
    <div class="actions"><div class="right"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="pSave">Salvar perfil</button></div></div>`);
  bindProfileFields(st);
  $('#pSave').onclick = async () => {
    const name = $('#pName').value.trim();
    if (!name) { $('#pErr').innerHTML = '<div class="err">O nome de usuário não pode ficar vazio.</div>'; return; }
    try { await store.saveUser(S.me.uid, { name, role: $('#pRole').value.trim(), photo: st.photo }); closeSheet(); toast('Perfil atualizado'); }
    catch (e) { $('#pErr').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; }
  };
}

function openMemberMenu(u) {
  if (!u) return;
  openSheet(`
    <div class="sheet-head">${avatar(u, 'lg')}<h3>${esc(u.name)}<span class="meta-line" style="display:block;font:400 12px var(--body)">${esc(u.email || '')}</span></h3><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <div class="menu"><button class="danger" id="mmRemove">${ICON.out} Remover acesso ao app</button></div>
    <div id="mmZone"></div>`);
  $('#mmRemove').onclick = () => {
    $('#mmZone').innerHTML = `<div class="confirm"><b>Remover ${esc(u.name)} da equipe?</b><p>A pessoa deixa de ver o app na hora. As tarefas dela continuam no quadro, e você pode liberar o acesso de novo depois.</p>
      <div class="row"><button class="btn btn-danger-solid" id="mmYes">Remover acesso</button><button class="btn btn-ghost" data-close>Cancelar</button></div></div>`;
    $('#mmYes').onclick = async () => { try { await store.saveUser(u.id, { aprovado: false, recusado: true }); closeSheet(); toast('Acesso removido'); } catch (e) { toast(errMsg(e)); } };
  };
}

function renderPending() {
  S.unsub.forEach(f => f && f()); S.unsub = [];
  const p = S.profile || {};
  $('#root').innerHTML = `
  <main class="auth"><div class="auth-box">
    <div class="brand"><div class="logo">b</div><div class="brand-name">belarmino flow<small>organizador da equipe belarmino agency</small></div></div>
    <div class="card-form">
      <div class="photo-pick">${avatar({ name: p.name || '?', photo: p.photo }, 'lg')}<div><b style="font-size:16px">${esc(p.name || '')}</b><p class="note">${esc(S.me?.email || '')}</p></div></div>
      ${p.recusado ? `<div class="err">Seu acesso não está liberado no momento. Fale com o Kaique se achar que é um engano.</div>`
        : `<h2 style="font-size:20px;color:#17158F">Aguardando aprovação</h2><p class="note" style="font-size:14px">Sua conta foi criada. Assim que o Kaique aprovar, o app abre sozinho aqui.</p>`}
      <button class="btn btn-primary" id="pendOut" type="button">Sair da conta</button>
    </div>
  </div></main>`;
  $('#pendOut').onclick = () => { S.unsub.forEach(f => f && f()); S.unsub = []; store.signOut(); };
  S.unsub.push(store.onMe(S.me.uid, me => { if (!me) return; S.profile = me; if (isApproved(me)) startApp(); }, () => {}));
}

/* =========================================================
   Início
   ========================================================= */
store.onAuth(async u => {
  S.me = u;
  if (!u) { S.unsub.forEach(f => f && f()); S.unsub = []; S.profile = null; return renderAuth(); }
  try {
    const p = await store.getUser(u.uid);
    if (p && p.name) { S.profile = p; isApproved(p) ? startApp() : renderPending(); }
    else if (!$('#pf')) renderProfileSetup();
  } catch (e) { renderAuth(errMsg(e)); }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
